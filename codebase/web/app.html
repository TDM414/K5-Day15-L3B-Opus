<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF8F2">
  <title>Đặt cơm trưa nhóm | Lunchie</title>
  <link rel="icon" href="assets/chef.webp" type="image/webp">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="frame header-inner">
      <a class="wordmark navbar-brand" href="./" aria-label="Lunchie, trang giới thiệu">
        <img src="assets/chef.webp" alt="" width="40" height="40">
        <span class="brand-name">Lunchie<span aria-hidden="true">.</span></span>
      </a>
      <span class="preview-label">Bản dùng thử</span>
    </div>
  </header>
  <main class="frame">
    <div class="page-heading">
      <h1>Đặt cơm trưa nhóm</h1>
      <p>Gom yêu cầu của mọi người và chốt một giỏ có phí ship rõ ràng.</p>
    </div>
    <nav aria-label="Tiến trình đặt cơm"><ol class="progress" id="progress"></ol></nav>
    <div class="workspace">
      <section class="panel" aria-labelledby="step-title">
        <div class="panel-heading">
          <h2 id="step-title" tabindex="-1"></h2>
          <button class="text-button guide-toggle" type="button" id="guide-toggle" aria-controls="guide" aria-expanded="true">Ẩn hướng dẫn</button>
        </div>
        <div class="guide" id="guide">
          <img src="assets/chef.webp" alt="" width="288" height="292">
          <p id="guide-text"></p>
        </div>
        <div id="step-content"></div>
      </section>
      <aside class="summary" aria-labelledby="summary-title">
        <div class="summary-heading">
          <h2 id="summary-title">Tóm tắt đơn</h2>
        </div>
        <div id="summary-content"></div>
      </aside>
    </div>
    <p class="page-note">Giá và tình trạng món lấy từ menu mẫu. Bạn tự đặt trên ứng dụng giao đồ ăn.</p>
  </main>
  <div id="announcement" class="visually-hidden" role="status"></div>
</body>
</html>
