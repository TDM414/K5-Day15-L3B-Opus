# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật (người đặt cơm hộ nhóm văn phòng) — 3 kịch bản
  low: 50
  base: 100
  high: 200
  source: "Cơ sở: 100 người đặt hộ văn phòng mục tiêu (tự ước tính, khớp spec.md §2); thấp 50 và cao 200 (tự ước tính)."

personas:           # 3 kiểu người dùng; share cộng lại = 1 (nguồn Q2 khảo sát n=56, evidence/survey/results_valid.csv)
  - name: dat_it
    share: 0.59             # 33/56 (58.9%) đặt 1–2 lần/tháng
    uses_per_month: 1.5     # trung điểm nhóm 1–2 lần/tháng (spec.md §2)
    turns_per_session: 1    # 1 lượt dựng giỏ (tự ước tính theo Pipeline 8 bước)
    source: "evidence/survey/results_valid.csv (n=56, Q2: 33/56 = 58.9% đặt 1-2 lần/tháng); turns_per_session: 1 (tự ước tính theo luồng suôn sẻ)"
  - name: dat_vua
    share: 0.32             # 18/56 (32.1%) đặt 3–5 lần/tháng
    uses_per_month: 4.0     # trung điểm nhóm 3–5 lần/tháng (spec.md §2)
    turns_per_session: 2    # 1 lượt dựng giỏ + 1 lượt hỏi bù/đổi món (tự ước tính theo Pipeline 8 bước)
    source: "evidence/survey/results_valid.csv (n=56, Q2: 18/56 = 32.1% đặt 3-5 lần/tháng); turns_per_session: 2 (tự ước tính theo luồng có hỏi bù/đổi)"
  - name: dat_nhieu
    share: 0.09             # 5/56 (8.9%) đặt >= 6 lần/tháng (2 người 6-10, 3 người >10)
    uses_per_month: 10.4    # trung bình ước tính nhóm >= 6 lần/tháng (spec.md §2)
    turns_per_session: 3    # 1 lượt dựng giỏ + 1 lượt quay xe + 1 lượt chốt (tự ước tính theo Pipeline 8 bước)
    source: "evidence/survey/results_valid.csv (n=56, Q2: 5/56 = 8.9% đặt >=6 lần/tháng); turns_per_session: 3 (tự ước tính theo luồng có quay xe)"

prices:             # USD / 1 triệu token — ≥2 mức model (giá trả phí tham chiếu OpenRouter / Google AI Studio)
  - model: gemini-2.5-flash
    input: 0.30
    output: 2.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 28/11/2026"
  - model: deepseek/deepseek-v4.1-flash
    input: 0.051
    output: 0.567
    source: "https://openrouter.ai/deepseek/deepseek-v4.1-flash · xem 28/11/2026 (mức provider tham chiếu trên OpenRouter)"
  - model: google/gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://openrouter.ai/google/gemini-4-hydrogen · xem 28/11/2026"

usd_to_vnd:         # tuỳ chọn: điền tỷ giá ở CP4 nếu cần quy đổi VNĐ
  rate:
  source:
